<div id="w" style="position:absolute;inset:0;background:#23232F;border-radius:24px;overflow:hidden"><canvas id="c" style="width:100%;height:100%;display:block"></canvas></div>
<script>
const W=760,H=824,cv=document.getElementById('c'),x=cv.getContext('2d');
function fit(){const d=window.devicePixelRatio||1;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);}fit();
const T='#3CC8B4',A='#F5B841',WD='#8A6A48',WL='#A9855E';
function circ(cx,cy,r,n){const p=[];for(let i=0;i<=n;i++){const a=-Math.PI/2+i*2*Math.PI/n;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}return p;}
function rect(a,b,c,d){return[[a,b],[c,b],[c,d],[a,d],[a,b]];}
const pieces=[
 {holes:[circ(185,300,38,40),rect(318,290,362,334)],out:[[120,160],[248,160],[248,250],[272,250],[272,160],[400,160],[400,400],[120,400],[120,160]]},
 {holes:[circ(550,300,44,40),rect(500,480,600,560)],out:[[440,180],[660,180],[660,380],[604,380],[604,404],[660,404],[660,640],[440,640],[440,180]]},
 {holes:[circ(260,580,48,6)],out:[[120,460],[400,460],[400,700],[120,700],[120,460]]}];
const ops=[];let pos=[690,120];
function len(p){let s=0;for(let i=1;i<p.length;i++)s+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return s;}
function add(type,pts,pi){const L=len(pts);ops.push({type,pts,pi,L,d:L/(type=='cut'?230:650)});}
pieces.forEach((pc,pi)=>{[...pc.holes,pc.out].forEach((p,k)=>{add('travel',[pos,p[0]],pi);add('cut',p,pi);pos=p[p.length-1];});ops[ops.length-1].done=pi;});
add('travel',[pos,[690,120]],-1);
let t0=0;ops.forEach(o=>{o.t0=t0;t0+=o.d;});const TOT=t0,HOLD=1.6;
function along(p,f){let target=len(p)*f,acc=0;for(let i=1;i<p.length;i++){const s=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(acc+s>=target){const u=s?(target-acc)/s:0;return{pt:[p[i-1][0]+(p[i][0]-p[i-1][0])*u,p[i-1][1]+(p[i][1]-p[i-1][1])*u],i};}acc+=s;}return{pt:p[p.length-1],i:p.length-1};}
function stroke(p,upto){x.beginPath();x.moveTo(p[0][0],p[0][1]);const a=along(p,upto);for(let i=1;i<a.i;i++)x.lineTo(p[i][0],p[i][1]);x.lineTo(a.pt[0],a.pt[1]);x.stroke();}
const smoke=[];let last=0;
function frame(ms){const now=ms/1000,dt=Math.min(0.05,now-last);last=now;let t=now%(TOT+HOLD);
 x.clearRect(0,0,W,H);
 x.fillStyle=WD;x.fillRect(60,100,640,660);
 x.strokeStyle='rgba(0,0,0,0.12)';x.lineWidth=1;for(let i=0;i<16;i++){x.beginPath();x.moveTo(60,100+i*44);x.lineTo(700,100+i*44);x.stroke();}
 let head=[690,120],cutting=false;
 ops.forEach(o=>{if(t>=o.t0+o.d&&o.done!==undefined){x.fillStyle=WL;x.beginPath();o.pts.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fill();
   pieces[o.done].holes.forEach(h=>{x.fillStyle='#23232F';x.beginPath();h.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.closePath();x.fill();});}});
 x.lineWidth=4;x.lineJoin='round';x.lineCap='round';x.strokeStyle=T;x.shadowColor=T;x.shadowBlur=10;
 ops.forEach(o=>{if(t<o.t0)return;const f=Math.min(1,(t-o.t0)/o.d);if(o.type=='cut'){stroke(o.pts,f);}
   if(t<o.t0+o.d){head=along(o.pts,f).pt;cutting=o.type=='cut';}});
 x.shadowBlur=0;
 if(t>=TOT)head=[690,120];
 if(cutting&&Math.random()<0.7)smoke.push({x:head[0],y:head[1],r:4,a:0.5,vx:(Math.random()-0.5)*20,vy:-25-Math.random()*20});
 for(let i=smoke.length-1;i>=0;i--){const s=smoke[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=12*dt;s.a-=0.45*dt;if(s.a<=0){smoke.splice(i,1);continue;}x.fillStyle='rgba(200,198,210,'+s.a+')';x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();}
 x.fillStyle='#4A4A62';x.fillRect(40,head[1]-12,680,24);
 x.fillStyle='#3A3A4E';x.fillRect(30,60,20,740);x.fillRect(710,60,20,740);
 x.fillStyle='#8E8EA8';x.beginPath();x.roundRect(head[0]-26,head[1]-26,52,52,10);x.fill();
 x.fillStyle='#5A5A76';x.beginPath();x.arc(head[0],head[1],13,0,7);x.fill();
 if(cutting){const g=x.createRadialGradient(head[0],head[1],0,head[0],head[1],26);g.addColorStop(0,'rgba(245,184,65,1)');g.addColorStop(0.35,'rgba(245,184,65,0.6)');g.addColorStop(1,'rgba(245,184,65,0)');x.fillStyle=g;x.beginPath();x.arc(head[0],head[1],26,0,7);x.fill();}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
